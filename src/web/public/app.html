<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title data-i18n="doc.app">Dexter · Research desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Noto+Serif+TC:wght@400;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..900;1,8..60,400..900&display=swap">
<link rel="stylesheet" href="/newsprint.css">
<link rel="stylesheet" href="/chat.css">
</head>
<body class="chatpage">
<div class="app" id="app">
  <aside class="side" id="sidebar" aria-label="Sidebar" data-i18n-aria="side.label">
    <div class="side-top">
      <a class="brand" href="/">Dexter</a>
      <button type="button" class="iconbtn" id="collapse" aria-expanded="true" aria-controls="sidebar" aria-label="Collapse sidebar" data-i18n-aria="side.collapse"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><rect x="3" y="3" width="18" height="18"/><line x1="9" y1="3" x2="9" y2="21"/></svg></button>
    </div>
    <button type="button" class="navitem" id="new-chat"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5l4 4L7 21l-4.5 1 1-4.5z"/></svg><span class="navlabel" data-i18n="app.new">New conversation</span></button>
    <label class="navitem searchrow" id="search-row"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16" y2="16"/></svg><input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Search conversations" data-i18n-placeholder="hist.search" aria-label="Search conversations" data-i18n-aria="hist.search"></label>
    <div class="side-scroll">
      <div id="history-list"></div>
      <p id="history-empty" class="note" data-i18n="hist.empty">No conversations yet.</p>
    </div>
    <div class="side-foot">
      <a class="navitem" href="/settings"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg><span class="navlabel" data-i18n="nav.settings">Settings</span></a>
      <a class="navitem" href="/"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 10l9-7 9 7v11H3z"/><polyline points="9 21 9 13 15 13 15 21"/></svg><span class="navlabel" data-i18n="nav.overview">Overview</span></a>
      <button type="button" class="navitem" data-logout hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M9 21H3V3h6"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span class="navlabel" data-i18n="acct.logout">Sign out</span></button>
      <button type="button" class="navitem" data-lang-toggle><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2c3 3 4 6.5 4 10s-1 7-4 10c-3-3-4-6.5-4-10s1-7 4-10z"/></svg><span class="navlabel" data-lang-label>繁體中文</span></button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <section class="pane">
    <header class="panebar">
      <button type="button" class="iconbtn mobileonly" id="open-side" aria-label="Open sidebar" data-i18n-aria="side.open"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <a class="label modelname" id="model-name" href="/settings"></a>
      <button type="button" class="iconbtn mobileonly" id="new-chat-top" aria-label="New conversation" data-i18n-aria="app.new"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5l4 4L7 21l-4.5 1 1-4.5z"/></svg></button>
    </header>

    <div class="scroller" id="scroller">
      <div class="column">
        <div id="empty" class="hero">
          <p class="label red" data-i18n="app.ready">Ready</p>
          <h1 data-i18n="app.title">Ask a financial research question.</h1>
        </div>
        <div id="turns" aria-live="polite"></div>
      </div>
    </div>

    <div class="dock">
      <div class="column">
        <form id="ask" class="composer">
          <label class="sr" for="query" data-i18n="app.label">Your question</label>
          <div class="box">
            <textarea id="query" name="query" rows="1" required maxlength="4000" placeholder="Ask a financial research question…" data-i18n-placeholder="app.placeholder"></textarea>
            <button type="submit" class="send" id="send" aria-label="Submit question" data-i18n-aria="app.send">↑</button>
          </div>
        </form>
        <ul class="suggest" id="samples">
          <li><button type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M14 2H6v20h12V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span data-i18n="app.s1">Summarise Apple's last five years of income statements.</span></button></li>
          <li><button type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span data-i18n="app.s2">Compare NVDA and AMD operating margins.</span></button></li>
          <li><button type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg><span data-i18n="app.s3">What changed in Tesla's most recent 10-K?</span></button></li>
        </ul>
        <p class="disclaimer" data-i18n="app.note">Educational and informational use only. Not financial advice; outputs may be incorrect or out of date.</p>
      </div>
    </div>
  </section>
</div>
<script src="/i18n.js"></script>
<script src="/vault.js"></script>
<script src="/app.js"></script>
</body>
</html>
