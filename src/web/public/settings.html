<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="doc.settings">Dexter · Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Noto+Serif+TC:wght@400;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..900;1,8..60,400..900&display=swap">
<link rel="stylesheet" href="/newsprint.css">
</head>
<body>
<div class="sheet">
  <div class="topbar label">
    <span data-i18n="nav.settings">Settings</span>
    <nav aria-label="Primary">
      <a href="/app" data-i18n="nav.desk">Research desk</a>
      <a href="/" data-i18n="nav.overview">Overview</a>
      <button type="button" class="langbtn" data-lang-toggle>繁體中文</button>
    </nav>
  </div>
  <div class="masthead compact"><a href="/">Dexter</a></div>

  <div class="spread">
    <div>
      <p class="label red" data-i18n="set.model.label">Model</p>
      <h2 data-i18n="set.model.title">Choose a model.</h2>
      <p class="note" data-i18n="set.shared">These settings are shared with the terminal version.</p>
    </div>
    <div>
      <div class="field">
        <label class="label" for="provider" data-i18n="set.provider">Provider</label>
        <select id="provider"></select>
      </div>
      <div class="field">
        <label class="label" for="model" data-i18n="set.model">Model</label>
        <select id="model"></select>
        <input id="model-text" type="text" spellcheck="false" autocomplete="off" hidden>
      </div>
      <p class="note" id="set-status" role="status"></p>
    </div>
  </div>

  <div class="spread">
    <div>
      <p class="label red" data-i18n="key.label">API keys</p>
      <h2 data-i18n="key.title">Connect your services.</h2>
      <p class="note" data-i18n="key.note">Keys are saved to the .env file in the project folder, the same one the terminal uses. They are never shown again after saving.</p>
    </div>
    <div id="keys"></div>
  </div>
</div>
<script src="/i18n.js"></script>
<script src="/settings.js"></script>
</body>
</html>
